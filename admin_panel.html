<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - GoGlobal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      :root {
          --primary: #C84B4B;
          --primary-dark: #991B1B;
          --accent: #FF6B6B;
          --cream: #FFF8F3;
          --dark: #1A1A1A;
          --gray: #666;
      }

      body {
          font-family: 'DM Sans', sans-serif;
          background: var(--cream);
          color: var(--dark);
      }

      /* Login Screen */
      .login-screen {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem;
      }

      .login-box {
          background: white;
          padding: 4rem;
          border-radius: 30px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.1);
          max-width: 450px;
          width: 100%;
      }

      .login-box h1 {
          font-family: 'Playfair Display', serif;
          font-size: 3rem;
          color: var(--primary);
          margin-bottom: 1rem;
          text-align: center;
      }

      .login-box p {
          text-align: center;
          color: var(--gray);
          margin-bottom: 2rem;
      }

      .form-group {
          margin-bottom: 1.5rem;
      }

      .form-group label {
          display: block;
          font-weight: 600;
          margin-bottom: 0.5rem;
      }

      .form-group input {
          width: 100%;
          padding: 1rem 1.5rem;
          border: 2px solid #E5E7EB;
          border-radius: 15px;
          font-family: 'DM Sans', sans-serif;
          font-size: 1rem;
          transition: all 0.3s;
      }

      .form-group input:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 0 4px rgba(200, 75, 75, 0.1);
      }

      .login-btn {
          width: 100%;
          padding: 1.2rem;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          color: white;
          border: none;
          border-radius: 50px;
          font-size: 1.1rem;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.3s;
      }

      .login-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 30px rgba(200, 75, 75, 0.3);
      }

      .error-message {
          background: #FEE2E2;
          color: #DC2626;
          padding: 1rem;
          border-radius: 10px;
          margin-bottom: 1.5rem;
          display: none;
      }

      .error-message.show {
          display: block;
      }

      /* Admin Dashboard */
      .admin-dashboard {
          display: none;
          min-height: 100vh;
          padding: 2rem;
      }

      .admin-dashboard.active {
          display: block;
      }

      .dashboard-header {
          background: white;
          padding: 2rem;
          border-radius: 20px;
          margin-bottom: 2rem;
          box-shadow: 0 5px 20px rgba(0,0,0,0.05);
          display: flex;
          justify-content: space-between;
          align-items: center;
      }

      .dashboard-header h1 {
          font-family: 'Playfair Display', serif;
          font-size: 2.5rem;
          color: var(--primary);
      }

      .logout-btn {
          padding: 0.8rem 2rem;
          background: var(--primary);
          color: white;
          border: none;
          border-radius: 50px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s;
      }

      .logout-btn:hover {
          background: var(--primary-dark);
      }

      .dashboard-grid {
          display: grid;
          grid-template-columns: 1fr 2fr;
          gap: 2rem;
          max-width: 1400px;
      }

      /* Add Vacancy Form */
      .add-vacancy-section {
          background: white;
          padding: 3rem;
          border-radius: 20px;
          box-shadow: 0 5px 20px rgba(0,0,0,0.05);
          height: fit-content;
          sticky: top: 2rem;
      }

      .add-vacancy-section h2 {
          font-family: 'Playfair Display', serif;
          font-size: 2rem;
          margin-bottom: 1.5rem;
          color: var(--dark);
      }

      .add-form .form-group {
          margin-bottom: 1.5rem;
      }

      .add-form label {
          display: block;
          font-weight: 600;
          margin-bottom: 0.5rem;
      }

      .add-form input,
      .add-form textarea,
      .add-form select {
          width: 100%;
          padding: 1rem;
          border: 2px solid #E5E7EB;
          border-radius: 10px;
          font-family: 'DM Sans', sans-serif;
          font-size: 1rem;
      }

      .add-form textarea {
          min-height: 100px;
          resize: vertical;
      }

      .add-form input:focus,
      .add-form textarea:focus,
      .add-form select:focus {
          outline: none;
          border-color: var(--primary);
      }

      .requirements-input {
          display: flex;
          gap: 0.5rem;
          margin-bottom: 0.5rem;
      }

      .requirements-input input {
          flex: 1;
      }

      .add-req-btn, .remove-req-btn {
          padding: 0.5rem 1rem;
          background: var(--cream);
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
      }

      .add-req-btn {
          background: var(--primary);
          color: white;
          width: 100%;
          margin-top: 0.5rem;
      }

      .submit-vacancy-btn {
          width: 100%;
          padding: 1.2rem;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          color: white;
          border: none;
          border-radius: 50px;
          font-weight: 700;
          cursor: pointer;
          margin-top: 1rem;
          transition: all 0.3s;
      }

      .submit-vacancy-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 30px rgba(200, 75, 75, 0.3);
      }

      /* Vacancies List */
      .vacancies-list-section {
          background: white;
          padding: 3rem;
          border-radius: 20px;
          box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      }

      .vacancies-list-section h2 {
          font-family: 'Playfair Display', serif;
          font-size: 2rem;
          margin-bottom: 2rem;
          color: var(--dark);
      }

      .vacancy-item {
          background: var(--cream);
          padding: 2rem;
          border-radius: 15px;
          margin-bottom: 1.5rem;
          position: relative;
      }

      .vacancy-item h3 {
          font-size: 1.5rem;
          color: var(--primary);
          margin-bottom: 0.5rem;
      }

      .vacancy-item .vacancy-type {
          color: var(--gray);
          font-size: 0.9rem;
          margin-bottom: 1rem;
      }

      .vacancy-item p {
          color: var(--dark);
          margin-bottom: 1rem;
      }

      .vacancy-item ul {
          list-style: none;
          padding-left: 0;
      }

      .vacancy-item li {
          padding: 0.3rem 0;
          padding-left: 1.5rem;
          position: relative;
          color: var(--gray);
          font-size: 0.9rem;
      }

      .vacancy-item li::before {
          content: '✓';
          position: absolute;
          left: 0;
          color: var(--primary);
      }

      .delete-btn {
          position: absolute;
          top: 1.5rem;
          right: 1.5rem;
          padding: 0.5rem 1.5rem;
          background: #DC2626;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          transition: all 0.3s;
      }

      .delete-btn:hover {
          background: #B91C1C;
      }

      .no-vacancies {
          text-align: center;
          color: var(--gray);
          padding: 3rem;
          font-style: italic;
      }

      @media (max-width: 968px) {
          .dashboard-grid {
              grid-template-columns: 1fr;
          }

          .add-vacancy-section {
              position: static;
          }
      }

      @media (max-width: 768px) {
          body {
              padding: 1rem;
          }

          .dashboard-header {
              flex-direction: column;
              gap: 1rem;
          }

          .dashboard-header h1 {
              font-size: 2rem;
              text-align: center;
          }

          .dashboard-header > div {
              width: 100%;
              display: flex;
              flex-direction: column;
              gap: 0.8rem;
          }

          .dashboard-header a,
          .logout-btn {
              width: 100%;
              text-align: center;
          }

          .login-box {
              padding: 2rem;
          }

          .login-box h1 {
              font-size: 2.5rem;
          }

          .add-vacancy-section,
          .vacancies-list-section {
              padding: 2rem;
          }

          .add-vacancy-section h2,
          .vacancies-list-section h2 {
              font-size: 1.5rem;
          }

          .vacancy-item {
              padding: 1.5rem;
          }

          .vacancy-item h3 {
              font-size: 1.3rem;
              margin-bottom: 2.5rem;
          }

          .delete-btn {
              top: 1rem;
              right: 1rem;
              padding: 0.4rem 1rem;
              font-size: 0.85rem;
          }
      }

      @media (max-width: 480px) {
          body {
              padding: 0.5rem;
          }

          .login-box {
              padding: 1.5rem;
          }

          .login-box h1 {
              font-size: 2rem;
          }

          .login-box p {
              font-size: 0.9rem;
          }

          .form-group input {
              padding: 0.9rem 1.2rem;
              font-size: 0.95rem;
          }

          .login-btn,
          .submit-vacancy-btn {
              padding: 1rem;
              font-size: 1rem;
          }

          .dashboard-header {
              padding: 1.5rem;
          }

          .dashboard-header h1 {
              font-size: 1.8rem;
          }

          .add-vacancy-section,
          .vacancies-list-section {
              padding: 1.5rem;
          }

          .add-form input,
          .add-form textarea,
          .add-form select {
              padding: 0.9rem;
              font-size: 0.95rem;
          }

          .vacancy-item {
              padding: 1.2rem;
          }

          .vacancy-item h3 {
              font-size: 1.2rem;
              padding-right: 3rem;
          }

          .vacancy-item p {
              font-size: 0.9rem;
          }

          .vacancy-item li {
              font-size: 0.85rem;
          }

          .delete-btn {
              padding: 0.4rem 0.8rem;
              font-size: 0.8rem;
          }

          .add-req-btn,
          .remove-req-btn {
              font-size: 0.9rem;
          }
      }
    </style>
  </head>
  <body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
      <div class="login-box">
        <h1>🔐 Admin</h1>
        <p>GoGlobal Admin Panel</p>

        <div class="error-message" id="errorMessage">Incorrect password!</div>

        <form id="loginForm">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter admin password" required />
          </div>
          <button type="submit" class="login-btn">Login</button>
        </form>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-dashboard" id="adminDashboard">
      <div class="dashboard-header">
        <h1>📋 Vacancies Manager</h1>
        <div style="display: flex; gap: 1rem">
          <a
            href="applications.html"
            style="
              padding: 0.8rem 2rem;
              background: #10b981;
              color: white;
              text-decoration: none;
              border-radius: 50px;
              font-weight: 600;
            "
          >
            View Applications
          </a>
          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="dashboard-grid">
        <!-- Add Vacancy Form -->
        <div class="add-vacancy-section">
          <h2>Add New Vacancy</h2>
          <form class="add-form" id="addVacancyForm">
            <div class="form-group">
              <label>Position Title *</label>
              <input type="text" id="vacancyTitle" placeholder="SAT Mentor" required />
            </div>

            <div class="form-group">
              <label>Icon (emoji)</label>
              <input type="text" id="vacancyIcon" placeholder="📚" maxlength="2" />
            </div>

            <div class="form-group">
              <label>Type *</label>
              <select id="vacancyType" required>
                <option value="VOLUNTEER • REMOTE">VOLUNTEER • REMOTE</option>
                <option value="PAID • REMOTE">PAID • REMOTE</option>
                <option value="VOLUNTEER • ON-SITE">VOLUNTEER • ON-SITE</option>
                <option value="PAID • ON-SITE">PAID • ON-SITE</option>
              </select>
            </div>

            <div class="form-group">
              <label>Description *</label>
              <textarea id="vacancyDescription" placeholder="Job description..." required></textarea>
            </div>

            <div class="form-group">
              <label>Requirements</label>
              <div id="requirementsList">
                <div class="requirements-input">
                  <input type="text" class="requirement-input" placeholder="Requirement 1" />
                </div>
              </div>
              <button type="button" class="add-req-btn" id="addRequirementBtn">+ Add Requirement</button>
            </div>

            <button type="submit" class="submit-vacancy-btn">✓ Publish Vacancy</button>
          </form>
        </div>

        <!-- Vacancies List -->
        <div class="vacancies-list-section">
          <h2>Current Vacancies (<span id="vacancyCount">0</span>)</h2>
          <div id="vacanciesList">
            <div class="no-vacancies">No vacancies yet. Add your first one! 👈</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
      // ВСТАВЬ СВОЙ FIREBASE CONFIG СЮДА! 👇
      const firebaseConfig = {
        apiKey: "AIzaSyDHpmM6ZUx-nx2oqc6U9FaeDyD-DUhTgY4",
        authDomain: "goglobal-ba1bd.firebaseapp.com",
        projectId: "goglobal-ba1bd",
        databaseURL: "https://goglobal-ba1bd-default-rtdb.europe-west1.firebasedatabase.app",
        storageBucket: "goglobal-ba1bd.firebasestorage.app",
        messagingSenderId: "742262514150",
        appId: "1:742262514150:web:bb19dd46674568c154f627",
        measurementId: "G-GCPJWLG451",
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // Password protection
      const ADMIN_PASSWORD = "goglobal2024"; // CHANGE THIS!

      // Elements
      const loginScreen = document.getElementById("loginScreen");
      const adminDashboard = document.getElementById("adminDashboard");
      const loginForm = document.getElementById("loginForm");
      const passwordInput = document.getElementById("passwordInput");
      const errorMessage = document.getElementById("errorMessage");
      const logoutBtn = document.getElementById("logoutBtn");
      const addVacancyForm = document.getElementById("addVacancyForm");
      const requirementsList = document.getElementById("requirementsList");
      const addRequirementBtn = document.getElementById("addRequirementBtn");
      const vacanciesList = document.getElementById("vacanciesList");
      const vacancyCount = document.getElementById("vacancyCount");

      let vacancies = [];

      // Check if already logged in
      if (sessionStorage.getItem("adminLoggedIn") === "true") {
        showDashboard();
      }

      // Login
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (passwordInput.value === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminLoggedIn", "true");
          showDashboard();
        } else {
          errorMessage.classList.add("show");
          setTimeout(() => errorMessage.classList.remove("show"), 3000);
        }
      });

      // Logout
      logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem("adminLoggedIn");
        loginScreen.style.display = "flex";
        adminDashboard.classList.remove("active");
        passwordInput.value = "";
      });

      function showDashboard() {
        loginScreen.style.display = "none";
        adminDashboard.classList.add("active");
        loadVacanciesFromFirebase();
      }

      // Add requirement field
      addRequirementBtn.addEventListener("click", () => {
        const newReq = document.createElement("div");
        newReq.className = "requirements-input";
        newReq.innerHTML = `
        <input type="text" class="requirement-input" placeholder="Requirement ${requirementsList.children.length + 1}">
    `;
        requirementsList.appendChild(newReq);
      });

      // Add vacancy to Firebase
      addVacancyForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const requirementInputs = document.querySelectorAll(".requirement-input");
        const requirements = Array.from(requirementInputs)
          .map((input) => input.value.trim())
          .filter((val) => val !== "");

        const newVacancy = {
          id: Date.now(),
          title: document.getElementById("vacancyTitle").value,
          icon: document.getElementById("vacancyIcon").value || "💼",
          type: document.getElementById("vacancyType").value,
          description: document.getElementById("vacancyDescription").value,
          requirements: requirements,
          createdAt: new Date().toISOString(),
        };

        // Save to Firebase
        database
          .ref("vacancies/" + newVacancy.id)
          .set(newVacancy)
          .then(() => {
            alert("✓ Vacancy published successfully!");
            addVacancyForm.reset();
            requirementsList.innerHTML = `
                <div class="requirements-input">
                    <input type="text" class="requirement-input" placeholder="Requirement 1">
                </div>
            `;
          })
          .catch((error) => {
            alert("Error: " + error.message);
          });
      });

      // Load vacancies from Firebase
      function loadVacanciesFromFirebase() {
        database.ref("vacancies").on("value", (snapshot) => {
          const data = snapshot.val();
          vacancies = data ? Object.values(data).sort((a, b) => b.createdAt.localeCompare(a.createdAt)) : [];
          renderVacancies();
        });
      }

      // Render vacancies
      function renderVacancies() {
        vacancyCount.textContent = vacancies.length;

        if (vacancies.length === 0) {
          vacanciesList.innerHTML = '<div class="no-vacancies">No vacancies yet. Add your first one! 👈</div>';
          return;
        }

        vacanciesList.innerHTML = vacancies
          .map(
            (v) => `
        <div class="vacancy-item">
            <button class="delete-btn" onclick="deleteVacancy(${v.id})">Delete</button>
            <h3>${v.icon} ${v.title}</h3>
            <div class="vacancy-type">${v.type}</div>
            <p>${v.description}</p>
            ${
              v.requirements && v.requirements.length > 0
                ? `
                <h4 style="margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1rem;">Requirements:</h4>
                <ul>
                    ${v.requirements.map((req) => `<li>${req}</li>`).join("")}
                </ul>
            `
                : ""
            }
        </div>
    `
          )
          .join("");
      }

      // Delete vacancy from Firebase
      function deleteVacancy(id) {
        if (confirm("Are you sure you want to delete this vacancy?")) {
          database
            .ref("vacancies/" + id)
            .remove()
            .then(() => {
              alert("✓ Vacancy deleted!");
            })
            .catch((error) => {
              alert("Error: " + error.message);
            });
        }
      }
    </script>
  </body>
</html>
